[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "predictor-core"
version = "2.2.1"
description = "Canonical scientific contracts and measurement library for Predictor domains"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Leonardo Sovienski" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.28.1,<1"]
scraping = ["curl-cffi>=0.13.0,<1"]
science = []
test = [
  "coverage[toml]>=7.10,<8",
  "pydantic>=2.11,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "curl-cffi>=0.13.0,<1",
  "httpx>=0.28.1,<1",
  "pydantic>=2.11,<3",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.403,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/predictor_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["predictor_core"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E731"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src/predictor_core"]
typeCheckingMode = "basic"

[dependency-groups]
dev = [{ include-group = "quality" }, { include-group = "test" }]
quality = ["build>=1.3,<2", "pre-commit>=4.3,<5", "pyright>=1.1.403,<2", "ruff>=0.12.7,<1"]
test = ["coverage[toml]>=7.10,<8", "pydantic>=2.11,<3", "pytest>=9.0.3,<10", "pytest-cov>=6.2,<8"]
