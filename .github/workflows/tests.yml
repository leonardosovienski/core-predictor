name: core-tests

# Onda 0 — CI do repositório canônico do predictor_core.
# Nenhuma promoção (metrics, bootstrap unificado, trials, ...) entra sem esta
# suíte verde. Protege todas as ondas seguintes contra regressão silenciosa na
# régua estatística — a base em que os três domínios confiam.
#
# Ativa automaticamente quando o canônico ganhar remoto GitHub (pendência do
# proprietário). Até lá, rode localmente: `py -3.14 -m pytest tests/ -q`.

on:
  push:
    branches: [main, "wave-*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # stdlib-first: o core não tem dependência de runtime obrigatória.
      # Apenas pytest (dev) é necessário para rodar a suíte.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run core test suite
        run: python -m pytest tests/ -q

      # Integridade do distribuidor: o --check não deve quebrar mesmo quando
      # nenhum consumidor está no checkout (retorna 0 e apenas relata o agregado).
      - name: Drift-check (self, no consumers in checkout)
        run: python sync_core.py --check
