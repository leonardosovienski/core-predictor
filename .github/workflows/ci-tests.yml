name: CI - Core Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-core:
    name: Validar Contratos e Matemática
    runs-on: ubuntu-latest

    steps:
    # O PULO DO GATO: Mandamos o Actions baixar o repo numa pasta chamada 'predictor_core'
    - name: Checkout do repositório
      uses: actions/checkout@v7
      with:
        path: predictor_core

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências da plataforma
      working-directory: ./predictor_core
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic httpx curl_cffi 

    - name: Rodar a suíte do Pytest
      working-directory: ./predictor_core
      run: |
        # PYTHONPATH=.. aponta o Python para a pasta anterior.
        # Assim, ele enxerga a pasta atual perfeitamente como o módulo 'predictor_core'!
        PYTHONPATH=.. python -m pytest -v

    - name: Validar integridade do Motor de Sincronização
      working-directory: ./predictor_core
      run: |
        python sync_core.py --check
