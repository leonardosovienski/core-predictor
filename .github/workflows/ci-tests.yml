name: CI - Core Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-core:
    name: Validar Contratos e Matemática
    runs-on: ubuntu-latest
    
    # MELHORIA 1: Definimos o PYTHONPATH globalmente para o job inteiro. 
    # Assim, tanto o pytest quanto o sync_core.py enxergam a pasta raiz como um pacote.
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # MELHORIA 2: Cache do pip. Isso salva as dependências e faz o CI rodar 
        # muito mais rápido (e mais barato) nas próximas execuções.
        cache: 'pip' 

    - name: Instalar dependências da plataforma
      run: |
        python -m pip install --upgrade pip
        # Instalando as dependências citadas no seu README
        pip install pytest pydantic httpx curl_cffi 

    - name: Rodar a suíte do Pytest
      run: |
        # MELHORIA 3: Adicionada a flag -v (verbose). 
        # Se algum teste falhar no futuro, o log do Actions vai te mostrar 
        # exatamente qual foi e os detalhes, em vez de um resumo genérico.
        pytest -v

    - name: Validar integridade do Motor de Sincronização
      run: |
        # Garante que as regras de domínios PARKED não foram quebradas
        python sync_core.py --check
