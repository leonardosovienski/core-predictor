# Apaga branches remotas já integradas (ou inúteis) por workflow_dispatch, uma por linha, nunca `main`.
# O push de deleção de branches é bloqueado no ambiente de desenvolvimento que abriu este workflow;
# o runner apaga a ref pela API do GitHub com o token do próprio job.
name: Delete branches

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Branches a apagar, uma por linha (main é sempre recusada)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        env:
          BRANCHES: ${{ inputs.branches }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r b; do
            b="${b//$'\r'/}"; b="$(echo "$b" | xargs)"; [[ -z "$b" ]] && continue
            [[ "$b" == "main" ]] && { echo "recusado: main" >&2; exit 1; }
            if git ls-remote --exit-code --heads origin "$b" >/dev/null; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b" && echo "apagada: $b"
            else
              echo "inexistente: $b"
            fi
          done <<< "$BRANCHES"
